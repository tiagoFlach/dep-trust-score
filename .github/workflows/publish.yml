name: Publish to npm (tag)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # necessário para --provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ -z "$PKG_VERSION" ]; then
            echo "Version not found in package.json"
            exit 1
          fi

          if [ "${TAG#v}" != "$PKG_VERSION" ]; then
            echo "Tag ($TAG) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          echo "Publishing dep-trust-score@$PKG_VERSION"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
