name: Update Ranking Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ranking-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Generate ranking data
        run: npm run generate:data

      - name: Commit updated data files
        run: |
          if git diff --quiet -- data; then
            echo "No changes detected in data/"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/npm-top-1000-popular.txt data/npm-top-1000-popular.json data/npm-top-1000-trust-ranking.json data/npm-top-1000-trust-ranking.csv data/npm-top-1000-trust-ranking.md
          git commit -m "chore(data): update npm ranking data"
          git push
